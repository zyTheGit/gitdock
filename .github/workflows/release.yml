name: Release

# 仅由 tag 触发：日常 push 继续只跑 ci.yml 的校验，版本发布由打 tag 显式发起。
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # 版本号由 npm run bump（scripts/version.mjs）一次写齐，安装包内显示的版本与
      # releases/latest 都取自这些声明；与 tag 不一致会让后续的版本检查读到错误结果，
      # 这里直接失败而不是继续打包。脚本只保证各处一致，对 tag 的核对留在这里。
      - name: Verify version matches tag
        shell: bash
        run: |
          expected="${TAG_NAME#v}"
          check() {
            actual=$(node -p "$2")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$1 的版本是 '$actual'，与 tag '$TAG_NAME' 不一致"
              exit 1
            fi
            echo "$1 = $actual"
          }
          check package.json "require('./package.json').version"
          check src-tauri/tauri.conf.json "require('./src-tauri/tauri.conf.json').version"
          check "Cargo.toml [workspace.package]" "require('fs').readFileSync('Cargo.toml','utf8').match(/^version\s*=\s*\"([^\"]+)\"/m)?.[1] ?? ''"

      # 只打 NSIS：targets 为 all 时 MSI 会再耗一遍构建，且 Release 里出现两套包。
      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      # 重跑同一个 tag 时走 upload --clobber，不删除已发布的 Release。
      # 安装包在工作区根 target 下（Cargo workspace），不在 src-tauri/target。
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(target/release/bundle/nsis/*-setup.exe)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::未找到 NSIS 安装包"
            exit 1
          fi

          prerelease=()
          case "$TAG_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "GitDock $TAG_NAME" \
              --generate-notes \
              "${prerelease[@]}"
          fi

          {
            echo "### GitDock $TAG_NAME"
            for asset in "${assets[@]}"; do
              echo "- \`$(basename "$asset")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
