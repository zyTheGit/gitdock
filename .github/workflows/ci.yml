name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 三平台同一门禁（npm run check：i18n 完整性、前端构建、fmt、clippy、workspace 测试）。
    # Windows 为主平台；ubuntu-22.04 取 glibc 2.35 基线（产物向上兼容 24.04+）；
    # macos-latest 为 Apple Silicon，对齐 docs/08「优先 Apple Silicon」推荐。
    # macOS/Linux 属准入 Spike 验证，不代表正式支持（见 docs/09 差距清单）。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 Linux 前置（WebKitGTK 等）加本项目特有的 libssl-dev：
      # ureq native-tls 在 Linux 落到 openssl-sys；macOS 走系统框架、
      # Windows 走 schannel，均无需安装。
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # 与本地共用同一份校验流程：前端构建、fmt、clippy、workspace 测试。
      - run: npm run check
