[workspace]

[package]
name = "terminal-backends"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["portable"]
portable = ["dep:portable-pty"]
conpty = ["dep:conpty"]

[dependencies]
portable-pty = { version = "0.9.0", optional = true }
conpty = { version = "0.7.0", optional = true }

[[bin]]
name = "terminal-probe"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
